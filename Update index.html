<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Schedule</title>

<!-- Tailwind -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  body { font-size: 12px; }
  table { font-size: 11px; }
  td, th { padding: 6px !important; }
</style>
</head>

<body class="bg-gray-100 p-4">

<div id="schedule" class="bg-white p-4 rounded shadow-lg">

  <h1 class="text-xl font-bold text-center mb-4">
    Weekly Work Schedule
  </h1>

  <table class="w-full border text-center">

    <thead class="bg-gray-800 text-white">
      <tr>
        <th>Employee</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th>Fri</th>
        <th>Sat</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody id="body"></tbody>

    <tfoot class="bg-gray-200 font-bold">
      <tr>
        <td>Total</td>
        <td id="d1">0</td>
        <td id="d2">0</td>
        <td id="d3">0</td>
        <td id="d4">0</td>
        <td id="d5">0</td>
        <td id="d6">0</td>
        <td>-</td>
      </tr>
    </tfoot>

  </table>
</div>

<!-- Button -->
<div class="text-center mt-4">
  <button onclick="exportPDF()" class="bg-blue-600 text-white px-6 py-2 rounded">
    Export PDF
  </button>
</div>

<script>

// ✅ Employees (Hojeij added)
const employees = ["Ali","Layla","Ali Fadlallah","Khodor","Hadi","Hojeij"];

// Create table
function createTable() {
  const body = document.getElementById("body");

  employees.forEach((name, i) => {

    let row = `<tr>
      <td class="font-bold">${name}</td>`;

    for (let d = 0; d < 6; d++) {
      row += `
      <td>
        <input type="time" class="in w-full" onchange="calculate()">
        <input type="time" class="out w-full" onchange="calculate()">
      </td>`;
    }

    row += `<td id="t${i}">0</td></tr>`;

    body.innerHTML += row;
  });
}

// Calculate hours
function calculate() {

  // Reset daily totals
  for (let i = 1; i <= 6; i++) {
    document.getElementById("d" + i).textContent = 0;
  }

  // Loop rows
  document.querySelectorAll("#body tr").forEach((row, i) => {

    let total = 0;

    for (let d = 0; d < 6; d++) {

      let inTime = row.querySelectorAll(".in")[d].value;
      let outTime = row.querySelectorAll(".out")[d].value;

      if (inTime && outTime) {

        let [h1, m1] = inTime.split(":").map(Number);
        let [h2, m2] = outTime.split(":").map(Number);

        // subtract 30 min break
        let diff = (h2*60 + m2) - (h1*60 + m1) - 30;

        if (diff > 0) {
          total += diff;

          let dayCell = document.getElementById("d" + (d+1));
          dayCell.textContent =
            (parseFloat(dayCell.textContent) + diff/60).toFixed(2);
        }
      }
    }

    document.getElementById("t" + i).textContent =
      (total / 60).toFixed(2);
  });
}

// Export PDF
function exportPDF() {
  html2pdf().from(document.getElementById("schedule")).save();
}

// Init
createTable();

</script>

</body>
</html>
