<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Schedule</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    @media print {
      body { margin: 0; padding: 5px; }
      #schedule { box-shadow: none; padding: 10px; }
    }

    body { font-size: 11px; }
    table { font-size: 10px; }

    input[type="time"],
    input[type="number"],
    input[type="date"] {
      font-size: 9px;
      padding: 2px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    td, th {
      padding: 4px !important;
    }
  </style>
</head>

<body class="bg-gray-100 p-2">

<div class="max-w-full mx-auto bg-white shadow-lg rounded-lg p-3" id="schedule">
  <h1 class="text-2xl font-bold mb-2 text-center">Weekly Work Schedule</h1>

  <table class="w-full border-collapse border border-gray-400 text-sm text-center">
    <thead>
      <tr class="bg-gray-200">
        <th class="border p-2">Employee</th>
        <th class="border p-2">Monday<br><input type="date" class="dateField w-full"></th>
        <th class="border p-2">Tuesday<br><input type="date" class="dateField w-full"></th>
        <th class="border p-2">Wednesday<br><input type="date" class="dateField w-full"></th>
        <th class="border p-2">Thursday<br><input type="date" class="dateField w-full"></th>
        <th class="border p-2">Friday<br><input type="date" class="dateField w-full"></th>
        <th class="border p-2">Saturday<br><input type="date" class="dateField w-full"></th>
        <th class="border p-2 bg-gray-300">Weekly Total</th>
      </tr>
    </thead>

    <tbody id="scheduleBody"></tbody>

    <tfoot>
      <tr class="bg-gray-100 font-bold">
        <td class="border p-2">TOTAL (hours)</td>
        <td id="total1">0</td>
        <td id="total2">0</td>
        <td id="total3">0</td>
        <td id="total4">0</td>
        <td id="total5">0</td>
        <td id="total6">0</td>
        <td class="bg-gray-200">--</td>
      </tr>
    </tfoot>
  </table>
</div>

<div class="text-center mt-4">
  <button onclick="generatePDF()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">
    Export as PDF
  </button>
</div>

<script>

  // ✅ UPDATED EMPLOYEES (Hojeij added)
  const employees = ["Ali", "Layla", "Ali Fadlallah", "Khodor", "Hadi", "Hojeij"];

  function createTable() {
    const body = document.getElementById("scheduleBody");
    body.innerHTML = "";

    employees.forEach((emp, empIndex) => {
      let row = `<tr>
        <td class="border p-2 font-semibold">${emp}</td>`;

      for (let i = 0; i < 6; i++) {
        row += `
        <td class="border p-1">
          <input type="time" class="in w-full" onchange="calculateTotals()">
          <span>-</span>
          <input type="time" class="out w-full" onchange="calculateTotals()">
          <br>
          <input type="number" class="pause w-full" placeholder="Pause (min)" onchange="calculateTotals()">
        </td>`;
      }

      row += `<td class="border p-2 font-bold bg-gray-100" id="empTotal${empIndex}">0</td></tr>`;
      body.innerHTML += row;
    });
  }

  function calculateTotals() {

    // Reset daily totals
    for (let d = 1; d <= 6; d++) {
      document.getElementById("total" + d).textContent = 0;
    }

    document.querySelectorAll("#scheduleBody tr").forEach((row, empIndex) => {

      let empTotal = 0;

      for (let d = 0; d < 6; d++) {

        const inTime = row.querySelectorAll(".in")[d].value;
        const outTime = row.querySelectorAll(".out")[d].value;
        const pause = parseInt(row.querySelectorAll(".pause")[d].value) || 0;

        if (inTime && outTime) {

          const [h1, m1] = inTime.split(":").map(Number);
          const [h2, m2] = outTime.split(":").map(Number);

          let diff = (h2 * 60 + m2) - (h1 * 60 + m1) - pause;

          if (diff > 0) {
            empTotal += diff;

            let dayCell = document.getElementById("total" + (d + 1));
            dayCell.textContent = (parseFloat(dayCell.textContent) + diff / 60).toFixed(2);
          }
        }
      }

      document.getElementById("empTotal" + empIndex).textContent = (empTotal / 60).toFixed(2);
    });
  }

  function generatePDF() {
    const element = document.getElementById("schedule");

    html2pdf().set({
      margin: 0.2,
      filename: "Work-Schedule.pdf",
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
    }).from(element).save();
  }

  // INIT
  createTable();

</script>

</body>
</html>
